<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FC Gaia Basquetebol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,600;1,700;1,800&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem("fcgaia-tema");if(!t)t=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme="dark"}</script>
</head><body><style>body{margin:0}
/* Layout: club masthead (crest + name + two tabs), then either the calendar board (month default) or the teams hub; instagram-like dark grain with gold display type. Deliberately single dark theme (club identity). */
:root{
  color-scheme:dark;
  --gold:#e2b812; --gold-hi:#f4d65a; --gold-lo:#9c7e08;
  --black:#000000; --bg:#151515; --panel:#1f1f1f; --panel-2:#2a2a2a; --line:#3a3a3a;
  --ink:#f2f2ee; --muted:#a8a8a0; --dim:#6f6f68; --win:#7fd39a; --loss:#ff8a7a; --hol:#ff8a7a;
  --t-sen:#e2b812; --t-esp:#f2f2ee; --t-s18:#ff9b54; --t-s16:#5fd0c2; --t-s14:#b7a2ff;
  --f-disp:"Anton","Impact","Arial Narrow",sans-serif;
  --f-cond:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--black)}
body{background-color:var(--bg);
  background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1.2px),radial-gradient(rgba(255,255,255,.025) 1px,transparent 1.2px);
  background-size:7px 7px,11px 11px;background-position:0 0,3px 5px;
  color:var(--ink);font-family:var(--f-cond);font-size:17px;line-height:1.35;min-height:100%}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.mast{background:var(--black);border-bottom:3px solid var(--gold)}
.mast-in{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:14px 0;display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 22px}
.brand{display:flex;align-items:center;gap:14px;padding-bottom:12px}
.brand img{width:64px;height:auto;display:block}
.brand h1{margin:0;font-family:var(--f-disp);font-weight:400;line-height:.9;text-transform:uppercase;letter-spacing:.5px}
.brand h1 .a{display:block;font-size:clamp(32px,6vw,46px);color:var(--ink)}
.brand h1 .b{display:block;font-size:clamp(17px,3vw,22px);color:var(--gold);letter-spacing:3px}
.tabs{display:flex;gap:4px;margin-left:auto}
.tab{background:transparent;border:0;cursor:pointer;font-family:var(--f-disp);font-size:clamp(20px,3.6vw,26px);text-transform:uppercase;color:var(--dim);padding:8px 14px 10px;border-bottom:4px solid transparent;margin-bottom:-3px;letter-spacing:.5px}
.tab[aria-selected="true"]{color:var(--gold);border-bottom-color:var(--gold)}
.tab:hover{color:var(--ink)}
.ticker{overflow:hidden;white-space:nowrap;background:var(--black);border-bottom:1px solid #222;font-family:var(--f-cond);font-style:italic;font-weight:700;font-size:11px;letter-spacing:1px;color:#8a8a82;padding:4px 0}
.ticker span{padding-right:22px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:18px 44px}
.eyebrow{font-family:var(--f-cond);font-weight:700;text-transform:uppercase;letter-spacing:2px;font-size:14px;color:var(--ink);margin:0}
.huge{font-family:var(--f-disp);font-weight:400;text-transform:uppercase;line-height:.92;margin:2px 0 0;font-size:clamp(52px,11vw,104px);letter-spacing:.5px;
  background:linear-gradient(180deg,var(--gold-hi) 0%,var(--gold) 45%,var(--gold-lo) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-wrap:balance}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0 10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{background:transparent;border:0;cursor:pointer;padding:7px 14px;font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--black)}
.nav{display:flex;gap:6px;margin-left:auto}
.nav button{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px 12px;cursor:pointer;font-weight:700;text-transform:uppercase;font-size:15px}
.nav button:hover{border-color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.chip{background:transparent;border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer;font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--tc)}
.chip[aria-pressed="true"]{border-color:var(--tc,var(--gold));color:var(--ink);background:var(--panel-2)}
.chip.all[aria-pressed="true"]{background:var(--gold);color:var(--black);border-color:var(--gold)}
.sen{--tc:var(--t-sen)} .esp{--tc:var(--t-esp)} .s18{--tc:var(--t-s18)} .s16{--tc:var(--t-s16)} .s14{--tc:var(--t-s14)}
/* game line, instagram agenda style */
.gm{display:block;width:100%;text-align:left;background:transparent;border:0;border-left:3px solid var(--tc);padding:4px 0 4px 10px;cursor:pointer;line-height:1.2}
.gm:hover .vs{color:var(--gold)}
.gm .vs{font-style:italic;font-weight:800;text-transform:uppercase;font-size:17px;color:var(--ink);display:block}
.gm .vs small{font-weight:700;font-size:12px;color:var(--dim);margin-right:4px;font-style:normal;letter-spacing:.5px}
.gm .meta{font-style:italic;font-weight:700;text-transform:uppercase;font-size:14px;color:var(--muted);display:block}
.gm .meta b{color:var(--gold);font-weight:800}
.gm .pav{font-weight:600;text-transform:uppercase;font-size:12.5px;letter-spacing:.4px;color:var(--dim);display:block}
.gm.pend{border-left-style:dashed}
.gm.pend .meta b{color:var(--muted)}
.lgo{position:relative;display:inline-flex;align-items:center;justify-content:center;width:1.55em;height:1.55em;border-radius:50%;background:var(--panel-2);border:1px solid var(--line);vertical-align:middle;margin-right:.4em;overflow:hidden;flex:none}
.lgo b{font-family:var(--f-cond);font-style:normal;font-weight:700;font-size:.5em;letter-spacing:0;color:var(--muted)}
.lgo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;padding:2px;opacity:0}
.lgo img.ok{opacity:1}
.lgo.gaia img{opacity:1}
.lgo.gaia{background:transparent;border:0}.lgo.gaia img{background:transparent;padding:0}
tr.me .lgo{border-color:rgba(0,0,0,.3)}
.score{font-variant-numeric:tabular-nums}
.w{color:var(--win)} .l{color:var(--loss)}
.hol{display:inline-block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--hol);border:1px solid var(--hol);border-radius:3px;padding:0 5px}
/* month */
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.mh{text-align:center;font-weight:700;text-transform:uppercase;letter-spacing:1px;font-size:13px;color:var(--muted);padding:4px 0}
.mh.we{color:var(--gold)}
.mc{background:var(--panel);border:1px solid transparent;border-radius:3px;min-height:46px;padding:5px;display:flex;flex-direction:column;gap:3px;cursor:pointer;text-align:left;min-width:0}
.mc:hover{border-color:var(--line)}
.mc.we{background:var(--panel-2)}
.mc.out{opacity:.35}
.mc.today .n{background:var(--gold);color:var(--black);border-radius:3px;padding:0 4px}
.mc.sel{border-color:var(--gold)}
.mc .n{font-family:var(--f-disp);font-size:19px;line-height:1.05;align-self:flex-start}
.mini{font-size:12.5px;font-weight:700;font-style:italic;text-transform:uppercase;line-height:1.15;border-left:3px solid var(--tc);padding-left:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.mini.pend{border-left-style:dashed;color:var(--muted)}
.mini em{color:var(--gold);font-style:inherit}
.dots{display:none;flex-wrap:wrap;gap:3px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--tc)}
.dot.pend{background:transparent;box-shadow:inset 0 0 0 1.5px var(--tc)}
.daypanel{margin-top:18px;background:var(--black);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.daypanel h3{margin:0;font-family:var(--f-disp);font-weight:400;font-size:28px;text-transform:uppercase;color:var(--gold);letter-spacing:.5px}
/* week / weekend */
.cols{display:grid;gap:8px}
.cols.c7{grid-template-columns:var(--wk,repeat(7,minmax(0,1fr)))}
.cols.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.col{background:var(--panel);border-radius:3px;padding:10px;display:flex;flex-direction:column;gap:10px;min-height:150px;min-width:0}
.col.we{background:var(--panel-2)}
.cols.c7 .col.none{min-height:0;padding:10px 6px;align-items:center;background:transparent;border:1px dashed var(--line)}
.cols.c7 .col.none h4{flex-direction:column;align-items:center;gap:2px;font-size:20px}
.cols.c7 .col.none h4 small{font-size:11px}
.cols.c7 .col.none .empty{color:var(--dim)}
.mc.emp{background:transparent;border:1px solid #262626}
.mc.emp .n{color:var(--dim);font-size:15px}
.mc.has{min-height:96px;background:var(--panel-2);border-color:var(--line)}
.mc.has .n{color:var(--gold)}
.mc.today .n,.mc.has.today .n{background:var(--gold);color:var(--black)}
.col.today{box-shadow:inset 0 0 0 2px var(--gold)}
.mc.today{position:relative;border:2px solid var(--gold);background:color-mix(in srgb,var(--gold) 14%,transparent)}
.mc.today::after{content:"Hoje";position:absolute;top:3px;right:5px;font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--gold)}
.mc.sel{box-shadow:0 0 0 2px var(--gold)}
.mc.today.sel{box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 45%,transparent)}
.col.today{background:color-mix(in srgb,var(--gold) 10%,transparent)}
.col.today h4::after{content:"Hoje";margin-left:6px;font-size:12px;padding:1px 6px;border-radius:3px;background:var(--gold);color:var(--black);letter-spacing:.8px;text-transform:uppercase;vertical-align:middle}
.daypanel.is-today{border-left:5px solid var(--gold)}
.daypanel .tag{font-family:var(--f-cond);font-weight:700;font-size:14px;letter-spacing:1px;background:var(--gold);color:var(--black);border-radius:3px;padding:2px 8px;vertical-align:middle;margin-right:8px}
@keyframes hojeflash{0%,100%{box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 45%,transparent)}50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--gold) 70%,transparent)}}
.flash{animation:hojeflash .5s ease-in-out 3}
@media (prefers-reduced-motion:reduce){.flash{animation:none}}
@media (max-width:560px){.mc.today::after{display:none}}
.col h4{margin:0;display:flex;align-items:baseline;gap:6px;font-family:var(--f-disp);font-weight:400;text-transform:uppercase;font-size:22px;line-height:1}
.col h4 small{font-family:var(--f-cond);font-weight:700;font-size:13px;letter-spacing:1px;color:var(--muted)}
.empty{color:var(--dim);font-style:italic;font-size:14px}
/* teams */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.tcard{position:relative;background:var(--black);border:1px solid var(--line);border-radius:4px;padding:16px 14px 14px;text-align:left;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;gap:6px;min-height:150px}
.tcard:hover{border-color:var(--tc)}
.tcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--tc)}
.tcard .lv{font-weight:700;text-transform:uppercase;letter-spacing:1.5px;font-size:12px;color:var(--muted)}
.tcard .nm{font-family:var(--f-disp);font-size:34px;line-height:.95;text-transform:uppercase;color:var(--ink)}
.tcard .nx{margin-top:auto;font-style:italic;font-weight:700;text-transform:uppercase;font-size:14px;color:var(--muted)}
.tcard .nx b{color:var(--gold)}
.tcard .pos{position:absolute;right:12px;top:10px;font-family:var(--f-disp);font-size:30px;color:var(--gold);line-height:1}
.tcard .pos small{font-family:var(--f-cond);font-size:12px;font-weight:700;color:var(--muted);letter-spacing:1px;display:block;text-align:right}
.fase{display:inline-flex;align-items:center;gap:10px;margin-top:14px;font-weight:700;text-transform:uppercase;letter-spacing:1px;font-size:14px;color:var(--muted)}
.fase select{font:inherit;font-size:16px;letter-spacing:.5px;color:var(--black);background:var(--gold);border:0;border-radius:3px;padding:7px 34px 7px 12px;cursor:pointer;appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,#000 50%),linear-gradient(135deg,#000 50%,transparent 50%);background-position:calc(100% - 17px) 52%,calc(100% - 12px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.fase select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.box .sub+.tblw{margin-top:-4px}
.tlist{display:flex;flex-direction:column;gap:8px;margin-top:20px}
.trow{position:relative;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,.8fr) minmax(0,.7fr) minmax(0,1.3fr) minmax(0,1.6fr) 24px;gap:18px;align-items:center;
  background:var(--black);border:1px solid var(--line);border-left:5px solid var(--tc);border-radius:4px;padding:14px 16px 14px 18px;text-align:left;cursor:pointer}
.trow:hover{border-color:var(--tc)}
.trow>span{display:flex;flex-direction:column;gap:2px;min-width:0}
.trow .lv{font-weight:700;text-transform:uppercase;letter-spacing:1.5px;font-size:12px;color:var(--muted)}
.trow .nm{font-family:var(--f-disp);font-size:32px;line-height:1;text-transform:uppercase;color:var(--ink)}
.trow .hd{font-weight:700;text-transform:uppercase;letter-spacing:1.5px;font-size:11px;color:var(--gold);margin-bottom:2px}
.trow .big{font-family:var(--f-disp);font-size:28px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.trow .big i{font-style:normal;font-family:var(--f-cond);font-weight:700;font-size:14px;color:var(--muted);margin:0 4px 0 2px}
.trow .sm{font-size:14px;font-weight:600;color:var(--muted);line-height:1.25}
.trow .sm b{color:var(--gold);font-weight:700}
.trow .sm b.w{color:var(--win)} .trow .sm b.l{color:var(--loss)}
.trow .dim{color:var(--dim)}
.trow .ln{display:flex;flex-direction:row;align-items:center;font-style:italic;font-weight:800;text-transform:uppercase;font-size:16px;color:var(--ink);min-width:0}
.trow .nm2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.trow .pv{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px;text-transform:uppercase;letter-spacing:.3px}
.trow .ha2{font-style:normal;font-weight:700;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);margin-left:8px;flex:none}
.trow .c-go{font-family:var(--f-disp);font-size:30px;color:var(--dim);align-items:center}
.trow:hover .c-go{color:var(--gold)}
@media (max-width:980px){
  .trow{grid-template-columns:minmax(0,1fr) auto auto 20px;grid-template-areas:"name pos rec go" "last last next next";gap:12px 16px}
  .c-name{grid-area:name}.c-pos{grid-area:pos;text-align:right}.c-rec{grid-area:rec;text-align:right}.c-go{grid-area:go}
  .c-last{grid-area:last}.c-next{grid-area:next}
  .trow .c-last,.trow .c-next{border-top:1px solid var(--line);padding-top:10px}
}
@media (max-width:560px){
  .trow{grid-template-columns:minmax(0,1fr) auto auto;grid-template-areas:"name name go" "pos rec rec" "last last last" "next next next";padding:12px 12px 12px 14px}
  .c-pos,.c-rec{text-align:left}
  .trow .nm{font-size:28px}
  .trow .c-next{padding-top:10px}
  .trow .c-last{padding-top:10px}
  .trow .c-go{align-self:start}
}
.gbox{margin-top:18px}
.ghead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.jnav{display:flex;align-items:center;gap:8px;font-family:var(--f-disp);font-size:22px;text-transform:uppercase;color:var(--ink)}
.jnav button{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:3px;width:36px;height:34px;font-size:20px;cursor:pointer;font-family:var(--f-cond);font-weight:700}
.jnav button:hover:not(:disabled){border-color:var(--gold);color:var(--gold)}
.jnav button:disabled{opacity:.3;cursor:default}
.glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
.gg{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;background:var(--panel);border:1px solid transparent;border-radius:3px;padding:10px 12px}
.gg.mine{border-color:var(--gold);cursor:pointer;background:var(--panel-2)}
.gg.mine:hover{background:#333}
.gg.pend{border-style:dashed;border-color:var(--line)}
.gg.mine.pend{border-color:var(--gold-lo)}
.gt{display:flex;align-items:center;min-width:0;font-weight:700;font-size:16px;color:var(--muted)}
.gt.me{color:var(--ink)}
.gn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.gs{font-family:var(--f-disp);font-size:20px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;min-width:2ch}
.gs.win{color:var(--gold)}
.gw{grid-column:1/-1;font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media print{.jnav button{display:none}.gg{background:#fff;border-color:#ccc}.gg.mine{border-color:var(--gold)}.gt,.gt.me{color:#000}}
.back{background:transparent;border:0;cursor:pointer;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:1px;padding:0;margin-bottom:6px}
.back:hover{color:var(--gold)}
.tdet{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;margin-top:18px}
.box{background:var(--black);border:1px solid var(--line);border-radius:4px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.box h3{margin:0;font-family:var(--f-disp);font-weight:400;font-size:30px;text-transform:uppercase;line-height:1;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold) 50%,var(--gold-lo));-webkit-background-clip:text;background-clip:text;color:transparent}
.box .sub{font-weight:700;text-transform:uppercase;letter-spacing:1px;font-size:13px;color:var(--muted);margin:-6px 0 0}
.rs{display:grid;grid-template-columns:1fr auto;gap:0 10px;border-left:3px solid var(--tc);padding-left:10px;font-style:italic;font-weight:800;text-transform:uppercase;font-size:16px;line-height:1.25}
.rs .tt{grid-column:1/-1;font-style:normal;font-weight:700;font-size:12px;letter-spacing:1px;color:var(--dim)}
.rs .sc{font-variant-numeric:tabular-nums;color:var(--gold);text-align:right}
.rs .ga{color:var(--ink)} .rs .op{color:var(--muted)}
.rs .badge{grid-column:1/-1;font-size:12px;letter-spacing:1px;font-style:normal}
.tblw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:16px;font-variant-numeric:tabular-nums}
th,td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:700}
th:nth-child(2),td:nth-child(2){text-align:left;white-space:normal}
td:first-child{font-family:var(--f-disp);font-size:18px;color:var(--muted);text-align:left}
tr.me td{color:var(--black);background:var(--gold);font-weight:700}
tr.me td:first-child{color:var(--black)}
tr.exc td{color:var(--dim);text-decoration:line-through}
.note{font-size:13px;color:var(--dim);font-style:italic;margin:0}
footer{margin-top:28px;font-size:13px;color:var(--dim);border-top:1px solid #262626;padding-top:12px}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted);margin-top:18px;text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.lg{display:inline-block;width:18px;height:0;border-top:3px solid var(--gold);vertical-align:middle;margin-right:6px}
.lg.d{border-top-style:dashed}
/* sheet */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}
.card{width:100%;max-width:440px;background:var(--black);border:1px solid var(--line);border-top:4px solid var(--tc);border-radius:4px;padding:18px 18px 16px}
.card .k{font-weight:700;text-transform:uppercase;letter-spacing:1.5px;font-size:13px;color:var(--muted)}
.card h2{font-family:var(--f-disp);font-weight:400;font-size:30px;line-height:1;margin:6px 0 12px;text-transform:uppercase;text-wrap:balance}
.card h2 span{color:var(--gold)}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;margin:0;font-size:16px}
.card dt{color:var(--muted);text-transform:uppercase;font-size:13px;letter-spacing:1px;font-weight:700;padding-top:2px}
.card dd{margin:0;font-weight:600}
.card .x{margin-top:16px;background:var(--gold);color:var(--black);border:0;border-radius:3px;padding:8px 16px;font-weight:800;text-transform:uppercase;letter-spacing:1px;cursor:pointer}
@media (max-width:820px){
  .cols.c7,.cols.c3{grid-template-columns:1fr}
  .col{min-height:0}
  .cols.c7 .col.none{display:none}
  .tdet{grid-template-columns:1fr}
}
@media (max-width:640px){
  .brand img{width:48px}
  .tabs{margin-left:0;width:100%}
  .tab{flex:1;text-align:center}
  .mc,.mc.has{min-height:54px;padding:4px}
  .mc .mini,.mc .hol{display:none}
  .mc .dots{display:flex}
  .mc .n{font-size:16px}
  .nav{margin-left:0;width:100%}
  .nav button{flex:1}
  .gm .vs{font-size:16px}
  .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .chip{flex:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.tlay{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;align-items:start}
.side{min-width:0;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);background:var(--black);border:1px solid var(--line);border-radius:4px;padding:12px}
.side-h{margin:0 0 8px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;font-size:12px;color:var(--gold)}
.side-l{display:flex;flex-direction:column;gap:2px}
.side-i{display:flex;align-items:center;gap:8px;background:transparent;border:0;border-radius:3px;padding:7px 8px;cursor:pointer;text-align:left;font-weight:700;text-transform:uppercase;letter-spacing:.6px;font-size:15px;color:var(--muted)}
.side-i i{width:8px;height:8px;border-radius:50%;background:var(--tc);flex:none}
.side-i:hover{color:var(--ink);background:var(--panel)}
.side-i[aria-current="true"]{background:var(--panel-2);color:var(--ink);box-shadow:inset 3px 0 0 var(--tc)}
.tmain{min-width:0}
.backbtn{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:7px 14px;cursor:pointer;font-weight:700;text-transform:uppercase;letter-spacing:1px;font-size:14px;color:var(--ink);margin-bottom:12px}
.backbtn:hover{border-color:var(--gold);color:var(--gold)}
.trow2{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 18px}
.trow2 .fase{margin-top:14px}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin:16px 0 0;color:var(--dim);font-size:14px}
.act{display:inline-flex;align-items:center;background:transparent;border:0;padding:4px 0;color:var(--muted);font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:.8px;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px;cursor:pointer}
.act:hover{color:var(--gold);text-decoration-color:var(--gold)}
.acts-note{margin:16px 0 0}
.cal-act{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:14px}
.cal-act .act{color:var(--gold);text-decoration-color:var(--gold-lo)}
@media (max-width:860px){
  .tlay{grid-template-columns:minmax(0,1fr);gap:12px}
  .side{position:static;padding:8px}
  .side-l{flex-direction:row;overflow-x:auto;gap:4px;scrollbar-width:none}
  .side-i{flex:none;font-size:13px;padding:6px 10px}
  .side-i[aria-current="true"]{box-shadow:inset 0 -3px 0 var(--tc)}
}
@media print{
  @page{size:A4 landscape;margin:10mm}
  html{background:#fff!important}
  footer p:last-child{display:none}
  footer{margin-top:8px;padding-top:6px;font-size:11px}
  :root{--bg:#fff;--panel:#fff;--panel-2:#f2f2f2;--ink:#000;--muted:#333;--dim:#555;--line:#bbb;--t-esp:#777}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  html,body{background:#fff!important;background-image:none!important;color:#000}
  .ticker,.tabs,.toolbar,.chips,.acts,.acts-note,.side,.backbtn,.fase,.daypanel,.c-go,.sheet,footer .x{display:none!important}
  .mast{background:#fff;border-bottom:3px solid var(--gold)}
  .brand h1 .a{color:#000}
  .wrap{max-width:none;padding:0}
  .tlay{display:block}
  .huge,.box h3{background:none!important;color:#000!important;-webkit-text-fill-color:#000;font-size:40px}
  .box,.trow,.daypanel,.card{background:#fff!important;border-color:#bbb}
  .box{break-inside:avoid}
  .month{gap:2px}.mc{min-height:80px;border:1px solid #ccc;background:#fff}.mc.we{background:#f4f4f4}.mc.out{opacity:.35}
  .mc .mini{display:block!important;color:#000}.mc .dots{display:none!important}.mc.today .n{background:none;color:#000}.mc.today{background:none!important}.mc.today::after,.col.today h4::after{display:none}
  .gm,.rs,.col{break-inside:avoid}
  .gm .vs,.trow .nm,.trow .big,.trow .ln{color:#000}
  tr.me td{background:var(--gold)!important;color:#000!important}
  .tdet{grid-template-columns:1fr 1fr}
  .cols.c7{grid-template-columns:var(--wk,repeat(7,minmax(0,1fr)))}
  .lgo img{opacity:1}
}
svg{width:1.15em;height:1.15em;flex:none}
.softbtn{display:inline-flex;align-items:center;gap:8px;background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 14px;color:var(--ink);font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.8px;cursor:pointer;text-decoration:none}
.softbtn:hover{border-color:var(--gold);color:var(--gold)}
.softbtn.gold{border-color:var(--gold);color:var(--gold)}
.subw{position:relative;display:inline-block}
.pop{position:absolute;z-index:25;top:calc(100% + 6px);left:0;min-width:260px;background:#0b0b0b;border:1px solid var(--line);border-radius:8px;padding:8px;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.acts .pop{top:auto;bottom:calc(100% + 6px)}
.pop-h{display:flex;align-items:center;gap:8px;margin:2px 4px 6px;font-weight:700;text-transform:uppercase;letter-spacing:1px;font-size:12px;color:var(--gold)}
.pop-n{margin:6px 4px 2px;font-size:12.5px;color:var(--dim);font-style:italic;line-height:1.3}
.pi{display:flex;align-items:center;gap:10px;width:100%;background:transparent;border:0;border-radius:6px;padding:9px 8px;color:var(--ink);text-decoration:none;font-weight:600;font-size:16px;cursor:pointer;text-align:left}
.pi:hover{background:var(--panel-2);color:var(--gold)}
.pi svg{color:var(--gold)}
.copyin{width:100%;font:inherit;font-size:13px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:6px}
.cardfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px}
.cardfoot .x{margin-top:0}
.sharew{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.shareimg{display:block;width:100%;max-width:300px;margin:6px auto 10px;border-radius:6px;border:1px solid var(--line)}
.trow2{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;margin-top:6px}
.trow2 .fase{margin-top:0}
.ttabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;gap:2px;margin:16px 0 0;background:var(--bg);border-bottom:1px solid var(--line);padding-top:4px}
.ttab{background:transparent;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;padding:10px 14px;cursor:pointer;font-family:var(--f-disp);font-size:20px;text-transform:uppercase;color:var(--dim);letter-spacing:.5px}
.ttab[aria-selected="true"]{color:var(--gold);border-bottom-color:var(--gold)}
.ttab:hover{color:var(--ink)}
.tbody{margin-top:18px}
.ovg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.more{align-self:flex-start;background:transparent;border:0;padding:4px 0;color:var(--gold);font-weight:700;text-transform:uppercase;letter-spacing:1px;font-size:13px;cursor:pointer;margin-top:auto}
.more:hover{text-decoration:underline;text-underline-offset:4px}
.box .rs{background:transparent;border:0;border-left:3px solid var(--tc);text-align:left;cursor:pointer;width:100%;color:inherit;font:inherit}
.box .rs:hover .ga{color:var(--gold)}
.sub2{margin:4px 0 0;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;font-size:12px;color:var(--muted)}
.mini-t{font-size:15px}.mini-t td,.mini-t th{padding:5px 6px}
.mres{display:flex;flex-direction:column;gap:4px}
.mr{display:grid;grid-template-columns:minmax(0,1fr) 30px 30px minmax(0,1fr);align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--muted)}
.mr span{display:flex;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mr span:last-child{justify-content:flex-end}
.mr span:last-child .lgo{margin:0 0 0 .4em}
.mr span.me{color:var(--ink)}
.mr b{font-family:var(--f-disp);font-weight:400;font-size:17px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.mr b.win{color:var(--gold)}
.plc{margin:2px 0 0;font-size:15px;color:var(--muted)}.plc b{font-family:var(--f-disp);font-weight:400;font-size:30px;color:var(--ink);margin-right:4px}
.cl{display:flex;flex-direction:column;gap:6px}
.cchip{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 14px 5px 5px;cursor:pointer;text-align:left;color:var(--ink)}
.cchip:hover{border-color:var(--gold)}
.cchip b{display:block;font-size:15px;font-weight:700}
.cchip small{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.av{position:relative;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--panel-2);border:1px solid var(--line);overflow:hidden;flex:none;color:var(--muted)}
.av b{font-family:var(--f-disp);font-weight:400}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;opacity:0}
.av img.ok{opacity:1}
.av.sm{width:38px;height:38px}.av.sm b{font-size:15px}
.av.xl{width:96px;height:96px}.av.xl b{font-size:34px}
.av.big{width:100%;height:100%;border-radius:0;border:0;background:linear-gradient(180deg,#2a2a2a,#1a1a1a)}.av.big b{font-size:44px;color:#3a3a3a}
.coord{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin:16px 0 4px;padding:12px 14px;background:var(--black);border:1px solid var(--line);border-radius:4px}
.coord-h{margin:0;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;font-size:12px;color:var(--gold)}
.coord-l{display:flex;flex-wrap:wrap;gap:8px}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:stretch}
.pair .gbox{margin-top:0}
.gbanner{margin:22px 0 14px;background:var(--gold);color:var(--black);border-radius:3px;padding:10px 16px;position:relative;overflow:hidden;scroll-margin-top:70px}
.gbanner span{position:relative;font-family:var(--f-disp);font-size:clamp(22px,4vw,32px);text-transform:uppercase;letter-spacing:.5px}
.gbanner::after{content:"#TODOSPELOGAIA";position:absolute;right:12px;top:50%;transform:translateY(-50%);font-family:var(--f-cond);font-style:italic;font-weight:800;font-size:13px;letter-spacing:1px;opacity:.55}
.sech{margin:6px 0 10px;font-family:var(--f-disp);font-weight:400;font-size:26px;text-transform:uppercase;color:var(--gold)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:22px}
.pcard{display:flex;flex-direction:column;background:var(--black);border:1px solid var(--line);border-radius:4px;overflow:hidden;text-align:left;color:var(--ink);padding:0}
button.pcard{cursor:pointer}button.pcard:hover{border-color:var(--gold)}
.pcard .ph{position:relative;aspect-ratio:4/5;max-width:100%;display:block;background:#1a1a1a}
.pcard .num{position:absolute;left:10px;top:4px;font-family:var(--f-disp);font-size:44px;line-height:1;background:linear-gradient(180deg,var(--gold-hi),var(--gold) 50%,var(--gold-lo));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
.pcard .role{position:absolute;left:8px;top:8px;background:var(--gold);color:var(--black);font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:1px;padding:2px 8px;border-radius:3px}
.pi2{display:flex;flex-direction:column;gap:2px;padding:10px 12px 12px}
.pi2 b{font-style:italic;font-weight:800;text-transform:uppercase;font-size:17px;line-height:1.1}
.pi2 small{font-size:12px;font-weight:700;letter-spacing:1px;color:var(--muted);text-transform:uppercase}
.pi2 em{font-style:normal;font-weight:700;font-size:12px;letter-spacing:1px;color:var(--gold);text-transform:uppercase;margin-top:4px}
.emptybox{display:flex;align-items:center;gap:12px;padding:16px;border:1px dashed var(--line);border-radius:4px;color:var(--muted);margin-bottom:16px}
.emptybox svg{width:28px;height:28px;color:var(--dim)}.emptybox p{margin:0}
.coachp .ch{display:flex;align-items:center;gap:16px;margin-bottom:6px}
.coachp h2{margin:2px 0 6px}
.grau{display:inline-block;font-weight:700;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--black);background:var(--gold);border-radius:3px;padding:2px 8px}
.rl{margin:6px 0 10px;padding-left:18px;font-size:16px}
.car{list-style:none;margin:8px 0 0;padding:0;max-height:46vh;overflow:auto;border-left:2px solid var(--line)}

.hero{position:relative;border-radius:4px;overflow:hidden;min-height:220px;background:linear-gradient(135deg,#1d1d1d,#0b0b0b);border:1px solid var(--line);display:flex;align-items:flex-end}

.hero .huge{font-size:clamp(46px,9vw,84px)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px;margin-top:16px}
.cl-row{display:flex;align-items:center;gap:12px;padding:8px 6px;border-radius:6px;text-decoration:none;color:var(--ink)}
a.cl-row:hover{background:var(--panel)}
.cl-row b{display:block;font-size:17px;font-weight:700}
.cl-row small{display:block;font-size:14px;color:var(--muted)}

.ci svg{width:22px;height:22px}
.ci.wa{background:#1f3a2a;color:#7fd39a}

.cta{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--gold);color:var(--black);text-decoration:none;font-family:var(--f-disp);font-size:24px;text-transform:uppercase;letter-spacing:.5px;padding:12px 18px;border-radius:4px;margin-top:auto}

.crow{display:flex;align-items:center;gap:12px;padding:6px 0}
.cn{flex:1;min-width:0}.cn b{display:block;font-size:16px}.cn small{display:block;font-size:13px;color:var(--muted)}

@media (max-width:860px){

const p2=n=>String(n).padStart(2,"0");
function tsLocal(date,time,addMin){const [y,m,d]=date.split("-").map(Number);const [h,mi]=time.split(":").map(Number);const x=new Date(y,m-1,d,h,mi+(addMin||0));return `${x.getFullYear()}${p2(x.getMonth()+1)}${p2(x.getDate())}T${p2(x.getHours())}${p2(x.getMinutes())}00`}
function dayStr(date,add){const x=pd(date);x.setDate(x.getDate()+(add||0));return `${x.getFullYear()}${p2(x.getMonth()+1)}${p2(x.getDate())}`}

function gcalUrl(g){const dates=g.time?`${tsLocal(g.date,g.time)}/${tsLocal(g.date,g.time,120)}`:`${dayStr(g.date)}/${dayStr(g.date,1)}`;
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(evTitle(g))+"&dates="+dates+"&ctz=Europe/Lisbon&details="+encodeURIComponent(evDesc(g))+"&location="+encodeURIComponent(ven(g))}
function icsEsc(s){return String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n")}
function icsFor(gs,name){const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//FC Gaia Basquetebol//Jogos//PT","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:"+icsEsc(name),"X-WR-TIMEZONE:Europe/Lisbon",
  "BEGIN:VTIMEZONE","TZID:Europe/Lisbon","BEGIN:STANDARD","DTSTART:19701025T020000","TZOFFSETFROM:+0100","TZOFFSETTO:+0000","RRULE:FREQ=YEARLY;BYMONTH=10;BYDAY=-1SU","END:STANDARD","BEGIN:DAYLIGHT","DTSTART:19700329T010000","TZOFFSETFROM:+0000","TZOFFSETTO:+0100","RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=-1SU","END:DAYLIGHT","END:VTIMEZONE"];
  const now=new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z";
  gs.filter(g=>g.date).forEach(g=>{L.push("BEGIN:VEVENT","UID:fcgaia-"+slug(g.team)+"-"+g.num+"@fcgaia-basquetebol","DTSTAMP:"+now);
    if(g.time)L.push("DTSTART;TZID=Europe/Lisbon:"+tsLocal(g.date,g.time),"DTEND;TZID=Europe/Lisbon:"+tsLocal(g.date,g.time,120));
    else L.push("DTSTART;VALUE=DATE:"+dayStr(g.date),"DTEND;VALUE=DATE:"+dayStr(g.date,1));
    L.push("SUMMARY:"+icsEsc(evTitle(g)+(g.res?" ("+g.res+")":"")),"LOCATION:"+icsEsc(ven(g)),"DESCRIPTION:"+icsEsc(evDesc(g)),"END:VEVENT")});
  L.push("END:VCALENDAR");return L.join("\r\n")}

function renderCal(){let eyebrow,title,body;
  if(S.view==="month"){const y=S.cur.getFullYear(),mo=S.cur.getMonth(),start=mon(new Date(y,mo,1,12));
    eyebrow=`Calendário ${y}`;title=MES[mo];
    body=`<div class="month">`+DW.map((d,i)=>`<div class="mh${i>=4?" we":""}">${d}</div>`).join("");
    for(let n=0;n<42;n++){const d=add(start,n);if(n===35&&d.getMonth()!==mo)break;const k=ks(d),gs=onDay(k),i=wd(d);
      body+=`<button class="mc${gs.length?" has":" emp"}${d.getMonth()!==mo?" out":""}${i>=4?" we":""}${k===TODAY?" today":""}${k===S.day?" sel":""}" data-day="${k}" aria-label="${d.getDate()} de ${MES[d.getMonth()]}: ${gs.length} jogos"><span class="n">${d.getDate()}</span>`+
      (HOL[k]?`<span class="hol">Feriado</span>`:"")+
      gs.slice(0,4).map(g=>`<span class="mini ${TM[g.team].cls}${pend(g)?" pend":""}"><em>${g.time?hh(g.time):"--"}</em> ${esc(TM[g.team].nm)}</span>`).join("")+
      (gs.length>4?`<span class="empty">+${gs.length-4} jogos</span>`:"")+
      `<span class="dots">${gs.map(g=>`<span class="dot ${TM[g.team].cls}${pend(g)?" pend":""}"></span>`).join("")}</span></button>`}
    body+=`</div>`;
    // se hoje não há jogos, mostra logo o próximo dia com jogos deste mês (até a pessoa escolher outro)
    if(!S.dayPicked&&S.day===TODAY&&!onDay(S.day).length){const nx=[...Array(31)].map((_,n)=>ks(add(pd(TODAY),n+1))).find(k=>pd(k).getMonth()===mo&&onDay(k).length);if(nx){S.day=nx;return renderCal()}}
    const sd=pd(S.day),gs=onDay(S.day);
    body+=`<section class="daypanel${S.day===TODAY?" is-today":""}"><h3>${S.day===TODAY?`<span class="tag">Hoje</span>`:""}${DWL[wd(sd)]}, ${sd.getDate()} de ${MES[sd.getMonth()]}${HOL[S.day]?` <span class="hol">${esc(HOL[S.day])}</span>`:""}</h3>${gs.length?gs.map(g=>line(g)).join(""):`<span class="empty">Sem jogos neste dia. Toca noutro dia do calendário.</span>`}</section>`}
  else{const m=mon(S.cur),e=add(m,6);eyebrow=`${m.getDate()} ${MS[m.getMonth()]} a ${e.getDate()} ${MS[e.getMonth()]}`;title="Agenda";
    const tpl=[0,1,2,3,4,5,6].map(n=>{const k=ks(add(m,n));return onDay(k).length?"minmax(0,1fr)":"72px"}).join(" ");
    body=`<div class="cols c7" style="--wk:${tpl}">${[0,1,2,3,4,5,6].map(n=>col(add(m,n))).join("")}</div>`;
    if(![0,1,2,3,4,5,6].some(n=>onDay(ks(add(m,n))).length))body+=`<p class="empty">Nenhum jogo nesta semana para as equipas escolhidas.</p>`}
  return `<p class="eyebrow">${eyebrow}</p><h2 class="huge">${title}</h2>
  <div class="toolbar"><div class="seg" role="group" aria-label="Vista">
   <button id="v-month" data-v="month" aria-pressed="${S.view==="month"}">Mês</button><button id="v-week" data-v="week" aria-pressed="${S.view==="week"}">Semana</button></div>

   <div class="nav"><button id="prev" aria-label="Anterior">‹ Ant.</button><button id="today">Hoje</button><button id="next" aria-label="Seguinte">Seg. ›</button></div></div>
  ${chips()}${body}${actions("cal")}
  <div class="legend"><span><i class="lg"></i>Jogo marcado</span><span><i class="lg d"></i>Por marcar (data de referência)</span><span><span class="hol">Feriado</span></span></div><p class="note">Jogos a tracejado ainda não têm data e hora confirmadas e aparecem na data prevista da jornada.</p>`}

function resCard(g,t){const d=pd(g.date),sc=score(g);const gaia=g.isHome?g.home:g.away;

  (sc?`<span class="badge ${sc.win?"w":"l"}">${sc.win?"Vitória":"Derrota"}</span>`:`<span class="badge">Resultado por inserir</span>`)+`</button>`}
function splitGames(gs){const fut=gs.filter(g=>!g.res&&(!g.date||g.date>=TODAY)).sort((a,b)=>(a.date||"9").localeCompare(b.date||"9")||(a.time||"").localeCompare(b.time||""));
  const past=gs.filter(g=>g.res||(g.date&&g.date<TODAY)).sort((a,b)=>b.date.localeCompare(a.date));return {fut,past}}

  if(mini){const me=rows.findIndex(x=>x.r[0].startsWith("FC Gaia"));const a=Math.max(0,Math.min(me-2,rows.length-5));rows=rows.slice(a,a+5)}
  const pm=st.rows.some(r=>r.length>5)&&!mini;
  return `<div class="tblw"><table class="${mini?"mini-t":""}"><thead><tr><th>#</th><th>Equipa</th><th>J</th><th>V</th><th>D</th><th>Pts</th>${pm?"<th>+/-</th>":""}</tr></thead><tbody>`+
  rows.map(({r,i})=>r[1]==="exc"?`<tr class="exc"><td>–</td><td>${logo(r[0])}${esc(r[0])}</td><td colspan="${pm?5:4}">Excluída</td></tr>`:

function lastJornada(t,cur){const leagues=GROUPS[t.id]||[];const gp=cur==="*"?leagues[leagues.length-1]:leagues.find(p=>p.phase===cur);if(!gp)return "";

function groupBox(t,cur){
  const leagues=(GROUPS[t.id]||[]);if(!leagues.length)return "";
  const gp=cur==="*"?leagues[leagues.length-1]:leagues.find(p=>p.phase===cur);if(!gp)return "";
  const mine=Object.fromEntries(G.filter(g=>g.team===t.id).map(g=>[g.num,g]));
  const rows=gp.rows.map(r=>{const [num,jor,date,time,home,away,res,venue]=r;const m=mine[num];
    return m?{num,jor,date:m.date,time:m.time,home:m.home,away:m.away,res:m.res,venue:ven(m),gaia:true,pend:pend(m),i:m.i}:{num,jor,date,time,home,away,res,venue:(!time&&!res)?"Pavilhão por definir":venue,gaia:false,pend:!time}});
  const jors=[...new Set(rows.map(r=>r.jor))].sort((a,b)=>a-b);
  const key=t.id+"|"+gp.phase;
  let j=S.jor[key];
  if(!jors.includes(j)){const played=rows.filter(r=>r.res).map(r=>r.jor);const nx=rows.filter(r=>r.gaia&&!r.res&&r.date&&r.date>=TODAY).sort((a,b)=>a.date.localeCompare(b.date))[0];
    j=played.length?Math.max(...played):(nx?nx.jor:jors[0])}
  const k=jors.indexOf(j);
  const list=rows.filter(r=>r.jor===j).sort((a,b)=>(a.date||"9").localeCompare(b.date||"9")||(a.time||"").localeCompare(b.time||""));
  const item=r=>{const d=r.date?pd(r.date):null;const sc=r.res?r.res.split("-").map(Number):null;
    const when=d?`${DWL[wd(d)].slice(0,3)} ${d.getDate()} ${MS[d.getMonth()]}${r.time?" · "+hh(r.time):" · a marcar"}`:"Adiado";
    const sd=(n,pts,win)=>`<span class="gt${n.includes("FC Gaia")?" me":""}">${logo(n)}<span class="gn">${esc(n)}</span></span><span class="gs${sc?(win?" win":" lose"):""}">${sc?pts:""}</span>`;
    return `<div class="gg${r.gaia?" mine":""}${r.pend&&!sc?" pend":""}"${r.gaia?` data-g="${r.i}" role="button" tabindex="0"`:""}>${sd(r.home,sc&&sc[0],sc&&sc[0]>sc[1])}${sd(r.away,sc&&sc[1],sc&&sc[1]>sc[0])}<span class="gw">${when} · ${esc(r.venue||"Pavilhão por definir")}</span></div>`};
  const stp=(STAND[t.id]||[]).find(p=>p.phase===gp.phase)||(STAND[t.id]||[]).slice(-1)[0];
  const inGame=new Set(list.flatMap(r=>[r.home,r.away]));
  const folga=stp?stp.rows.filter(r=>r[1]!=="exc"&&!inGame.has(r[0])).map(r=>r[0]):[];
  const excl=stp?stp.rows.filter(r=>r[1]==="exc").map(r=>r[0]):[];
  const note=(folga.length?`<p class="folga"><b>Sem jogo nesta jornada:</b> ${folga.map(esc).join(", ")}</p>`:"")+(folga.length&&excl.length?`<p class="folga dim">${excl.map(esc).join(", ")} saiu da prova e os jogos com esta equipa foram anulados.</p>`:"");
  return `<section class="box gbox"><div class="ghead"><h3>Jornadas</h3><div class="jnav"><button id="jprev" data-key="${esc(key)}" data-j="${k>0?jors[k-1]:""}"${k>0?"":" disabled"} aria-label="Jornada anterior">‹</button><span>${j}.ª Jornada</span><button id="jnext" data-key="${esc(key)}" data-j="${k<jors.length-1?jors[k+1]:""}"${k<jors.length-1?"":" disabled"} aria-label="Jornada seguinte">›</button></div></div>
  <div class="glist">${list.map(item).join("")}</div>${note}</section>`}

      if(n%7===6)cells+="</tr><tr>"}
    html+=`<table class="pv-month" style="--rows:${rows}"><thead><tr>${DW.map(d=>`<th>${d}</th>`).join("")}</tr></thead><tbody><tr>${cells}</tr></tbody></table><p class="pv-leg">C = casa · F = fora · horas a tracejado ainda por marcar</p>`;
    return {html,zoom:1}}
  let rowsH="",day="",n=0;gs.forEach(g=>{if(g.date!==day){day=g.date;const d=pd(day);rowsH+=`<tr class="pv-day"><td colspan="5">${DWL[wd(d)]}, ${d.getDate()} de ${MES[d.getMonth()]}${HOL[day]?` · ${esc(HOL[day])}`:""}</td></tr>`;n++}
    const sc=score(g);rowsH+=`<tr class="${TM[g.team].cls}"><td class="pv-h">${tm(g)}</td><td class="pv-t">${esc(tn(g))}</td><td>${g.isHome?"Casa":"Fora"} · vs ${esc(g.opp)}</td><td>${esc(ven(g))}</td><td class="pv-r">${sc?`${sc.win?"V":"D"} ${sc.us}-${sc.th}`:""}</td></tr>`;n++});
  if(!gs.length)rowsH=`<tr><td colspan="5">Sem jogos nesta semana.</td></tr>`;
  html+=`<table class="pv-week">${rowsH}</table>`;
  return {html,zoom:Math.min(1,600/(Math.max(n,1)*27))}}

    const done=()=>{b.querySelector("span").textContent="Link copiado ✓";setTimeout(()=>{const x=b.querySelector("span");if(x)x.textContent="Partilhar"},2500)};

    save();render()}
  else if(b.dataset.day){S.day=b.dataset.day;S.dayPicked=true;render();const p=document.querySelector(".daypanel");if(p&&window.innerWidth<700)p.scrollIntoView({block:"start",behavior:"smooth"})}

  else if(b.id==="back"){S.team=null;setHash("#equipas");render();window.scrollTo(0,0)}
