<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inscrições · FC Gaia Basquetebol</title>
<script>try{var t=localStorage.getItem("fcgaia-tema");if(!t)t=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme="dark"}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,600;1,700;1,800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --gold:#e2b812; --gold-hi:#f4d65a; --gold-lo:#9c7e08;
  --black:#000000; --bg:#151515; --panel:#1f1f1f; --panel-2:#2a2a2a; --line:#3a3a3a;
  --ink:#f2f2ee; --muted:#a8a8a0; --dim:#6f6f68; --ok:#7fd39a; --warn:#ff8a7a;
  --f-disp:"Anton","Impact","Arial Narrow",sans-serif;
  --f-cond:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--black)}
body{margin:0;background-color:var(--bg);
  background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1.2px),radial-gradient(rgba(255,255,255,.025) 1px,transparent 1.2px);
  background-size:7px 7px,11px 11px;background-position:0 0,3px 5px;
  color:var(--ink);font-family:var(--f-cond);font-size:18px;line-height:1.35;min-height:100%}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
a{color:var(--gold)}
/* masthead (igual ao calendário) */
.mast{background:var(--black);border-bottom:3px solid var(--gold)}
.mast-in{max-width:880px;margin:0 auto;padding:14px 16px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px}
.brand{display:flex;align-items:center;gap:14px}
.brand img{width:56px;height:auto;display:block}
.brand h1{margin:0;font-family:var(--f-disp);font-weight:400;line-height:.9;text-transform:uppercase;letter-spacing:.5px}
.brand h1 .a{display:block;font-size:clamp(28px,6vw,40px);color:var(--ink)}
.brand h1 .b{display:block;font-size:clamp(15px,3vw,19px);color:var(--gold);letter-spacing:3px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-left:auto}
.seg button{background:transparent;border:0;cursor:pointer;padding:7px 14px;font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--black)}
.wrap{max-width:880px;margin:0 auto;padding:20px 16px 44px}
.eyebrow{font-weight:700;text-transform:uppercase;letter-spacing:2px;font-size:14px;color:var(--ink);margin:0}
.huge{font-family:var(--f-disp);font-weight:400;text-transform:uppercase;line-height:.92;margin:4px 0 10px;font-size:clamp(44px,9vw,84px);letter-spacing:.5px;
  background:linear-gradient(180deg,var(--gold-hi) 0%,var(--gold) 45%,var(--gold-lo) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-wrap:balance}
#intro{margin:0;color:var(--muted);max-width:62ch;font-size:17px}
.rule{margin:16px 0 20px;padding:10px 14px;border-left:4px solid var(--gold);background:var(--black);border-radius:4px;color:var(--ink);font-size:16px}
.grid{display:block}
/* secções */
.sec{background:var(--black);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:4px;padding:16px 16px 18px;margin:0 0 16px}
.s2{border-left-color:var(--ok)} .s4{border-left-color:var(--gold-lo)}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 0 14px}
.sechead h2.st{font-family:var(--f-disp);font-weight:400;font-size:24px;line-height:1;text-transform:uppercase;letter-spacing:.5px;color:var(--gold);margin:0;display:flex;align-items:center;gap:10px}
.num{width:26px;height:26px;border-radius:3px;background:var(--gold);color:var(--black);display:inline-grid;place-items:center;font-size:17px}
.s2 .num{background:var(--ok)}
.nav{display:flex;gap:6px}
.nav button,.ghost{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px 12px;cursor:pointer;font-weight:700;text-transform:uppercase;font-size:14px;color:var(--ink)}
.nav button:hover,.ghost:hover{border-color:var(--gold)}
.trail{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px;padding:0;list-style:none}
.trail li{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;border:1px solid var(--line);border-radius:999px;padding:3px 12px;color:var(--muted)}
.trail b{color:var(--ink)}
.step{font-weight:700;text-transform:uppercase;letter-spacing:1.5px;font-size:13px;color:var(--muted);margin-bottom:2px}
.q h2{font-family:var(--f-disp);font-weight:400;text-transform:uppercase;font-size:clamp(26px,4.5vw,34px);line-height:1.02;margin:0 0 16px;color:var(--ink);letter-spacing:.3px}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opts button,#pmiss,#pall{cursor:pointer;border-radius:4px;padding:10px 20px;font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.8px;border:1px solid var(--gold);background:transparent;color:var(--gold)}
.opts button:hover,#pall:hover{background:var(--gold);color:var(--black)}
button.primary{background:var(--gold)!important;color:var(--black)!important}
button.primary:hover{background:var(--gold-hi)!important}
.progtxt{font-size:15px;color:var(--muted)}
/* nacionalidade */
#pais{width:100%;font:18px var(--f-cond);padding:12px 14px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink)}
#pais::placeholder{color:var(--dim)}
.natlist{list-style:none;margin:8px 0 0;padding:0;border:1px solid var(--line);border-radius:4px;overflow:hidden;max-height:340px;overflow-y:auto}
.natlist li button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:0;border-top:1px solid var(--line);font-size:18px;font-weight:700;text-transform:uppercase;padding:12px 14px;color:var(--ink);background:var(--panel);cursor:pointer}
.natlist li:first-child button{border-top:0}
.natlist li button:hover,.natlist li button:focus-visible{background:var(--panel-2);color:var(--gold)}
.natlist small{color:var(--muted);font-size:13px;letter-spacing:.5px}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.quick span{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);width:100%}
.chip{background:transparent;border:1px solid var(--line);border-radius:999px;padding:5px 13px;cursor:pointer;font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.chip:hover{border-color:var(--gold);color:var(--ink)}
.chip .ic{color:var(--gold);margin-right:4px}
.natinfo{margin-top:12px;font-size:16px;min-height:1.4em}
.badge{display:inline-block;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.6px;padding:2px 10px;border-radius:3px;margin-right:6px}
.badge.ok{background:var(--ok);color:var(--black)}
.badge.no{background:var(--gold);color:var(--black)}
.badge.warn{border:1px solid var(--warn);color:var(--warn)}
/* resultado */
.rhead{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.result .code{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:4px;background:var(--gold);color:var(--black);font-family:var(--f-disp);font-size:28px;flex:none}
.rhead h2{font-family:var(--f-disp);font-weight:400;text-transform:uppercase;font-size:clamp(24px,4vw,32px);line-height:1;margin:0;color:var(--ink)}
.where{margin:0;color:var(--muted)}
.where b{color:var(--gold)}
.prog{height:6px;background:var(--panel-2);border-radius:3px;overflow:hidden;margin:4px 0 14px}
.prog i{display:block;height:100%;width:0;background:var(--gold);transition:width .25s}
h3{font-family:var(--f-disp);font-weight:400;text-transform:uppercase;font-size:20px;letter-spacing:.3px;color:var(--gold);margin:18px 0 4px}
ul.check{list-style:none;margin:0;padding:0}
ul.check li{border-bottom:1px solid var(--line)}
ul.check label{display:flex;gap:12px;padding:9px 2px;cursor:pointer;align-items:flex-start;font-size:17px}
ul.check input{width:19px;height:19px;margin-top:2px;accent-color:var(--gold);flex:none}
ul.check input:checked+span{color:var(--dim);text-decoration:line-through}
.star{color:var(--gold);font-weight:700}
.key{font-weight:700;color:var(--ink)}
.notes{margin:16px 0 0;padding:12px 14px;background:var(--panel);border-radius:4px;font-size:16px;color:var(--muted)}
.notes p{margin:4px 0}
.sec p.lead{margin:-6px 0 12px;font-size:15px;color:var(--muted)}
.s4 .row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.s4 label{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);display:flex;flex-direction:column;gap:5px;flex:1 1 200px}
.s4 input,.s4 select{font:18px var(--f-cond);padding:9px 12px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink);text-transform:none;letter-spacing:0}
.printmsg{font-size:15px;color:var(--ok);min-height:1em;margin-top:8px}
.docmsg{font-size:14px;color:var(--muted);min-height:1em;margin-top:6px}
/* anexos discretos */
.side{margin:8px 0 0;padding:14px 0 0;border-top:1px solid var(--line)}
.side h2{font-weight:700;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.side .chips{display:flex;flex-wrap:wrap;gap:6px}
footer{margin-top:30px;padding-top:12px;border-top:1px solid var(--line);font-size:15px;color:var(--dim)}
#printout{display:none}
@media print{
  @page{margin:16mm}
  html,body{background:#fff!important;background-image:none!important;color:#000;font-size:12pt}
  .mast,.wrap{display:none}
  #printout{display:block;color:#000}
  #printout h1{font:400 24pt/1 var(--f-disp);text-transform:uppercase;margin:0 0 6pt;color:#000;border-bottom:3pt solid #e2b812;padding-bottom:4pt}
  #printout .meta{margin:0 0 10pt;font-size:11pt;color:#333}
  #printout .en{display:block;font-style:italic;color:#555;font-size:10pt}
  #printout h2{font:400 14pt var(--f-disp);text-transform:uppercase;color:#9c7e08;margin:12pt 0 4pt;border-bottom:1pt solid #e2b812}
  #printout ul{list-style:none;margin:0;padding:0}
  #printout li{padding:5pt 0 5pt 22pt;border-bottom:.5pt solid #ccc;position:relative;page-break-inside:avoid;font-size:12pt}
  #printout li::before{content:"";position:absolute;left:2pt;top:7pt;width:10pt;height:10pt;border:1pt solid #000}
  #printout .pnotes{margin-top:10pt;font-size:10.5pt;color:#333}
  #printout .pnotes p{margin:3pt 0}
  #printout .sign{margin-top:18pt;font-size:10.5pt;color:#333}
  #printout .phead{display:flex;align-items:center;gap:10pt;margin-bottom:8pt}
  #printout .phead img{width:34pt}
  #printout .phead b{font:400 13pt var(--f-disp);text-transform:uppercase}
}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}
.dlist{list-style:none;margin:0;padding:0}
.dlist li{border-top:1px solid var(--line)}
.dlist li:first-child{border-top:0}
.dlist button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:0;padding:9px 2px;cursor:pointer;font-size:16px;color:var(--muted)}
.dlist button:hover .nm{color:var(--gold)}
.dlist .ic{color:var(--gold);font-weight:700}
.dlist .nm{flex:1}
.dlist .need{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#000;background:var(--gold);border-radius:3px;padding:1px 7px;flex:none}
/* tema claro, igual ao site */
:root[data-theme="light"]{color-scheme:light;--bg:#f3f2ee;--panel:#ffffff;--panel-2:#ebe9e3;--line:#d7d4cb;--ink:#151515;--muted:#55554f;--dim:#76766e;--ok:#1f8a46;--warn:#c0392b;--gold:#b08a00;--gold-hi:#c9a20a;--gold-lo:#7a6200}
html[data-theme="light"]{background:var(--bg)}
html[data-theme="light"] body{background-image:radial-gradient(rgba(0,0,0,.035) 1px,transparent 1.2px),radial-gradient(rgba(0,0,0,.025) 1px,transparent 1.2px)}
html[data-theme="light"] .mast{--gold:#e2b812;--ink:#f2f2ee;--muted:#a8a8a0;--line:#3a3a3a}
html[data-theme="light"] :is(.sec,.rule){background:var(--panel)}
html[data-theme="light"] .huge{background:none;-webkit-text-fill-color:var(--gold);color:var(--gold)}
.backbar{max-width:880px;margin:0 auto;padding:12px 16px 0;display:flex;flex-wrap:wrap;gap:8px 18px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;font-size:15px}
.backbar a{color:var(--gold);text-decoration:none}.backbar a:hover{text-decoration:underline}
.brand a{display:flex;align-items:center;gap:14px;color:inherit;text-decoration:none}
.dlist a{display:flex;align-items:center;gap:10px;width:100%;text-decoration:none;padding:9px 2px;font-size:16px;color:var(--muted)}
.dlist a:hover .nm{color:var(--gold)}
</style>
</head>

const esc = t => String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function doPrint(code, onlyMissing){
  const r=R[code], blocks=listFor(code), pl=PLANG||LANG;
  const tx = (o,suf="") => pl==="both" ? `${o.pt}${suf}<span class="en">${o.en}${suf}</span>` : o[pl]+suf;
  const lb = o => pl==="both" ? `${o.pt} / <i>${o.en}</i>` : o[pl];
  const txs = (fn,arg) => pl==="both" ? `${fn.pt(arg)}<span class="en">${fn.en(arg)}</span>` : fn[pl](arg);
  let idx=0, body="", count=0;
  blocks.forEach(bl=>{
    const items = bl.items.map(it=>({it,k:code+":"+(idx++)})).filter(x=>!onlyMissing||!CHECKED.has(x.k));
    if(!items.length) return;
    if(blocks.length>1) body += `<h2>${tx(bl.h)}</h2>`;
    body += `<ul>`+items.map(x=>{count++;return `<li>${tx(x.it,x.it.star?" *":"")}</li>`}).join("")+`</ul>`;
  });
  if(!count){document.getElementById("pmsg").textContent=T(UI.pbDone);return;}
  const today=new Date().toLocaleDateString("pt-PT");
  const nm=(document.getElementById("pname")||{}).value||"";
  let meta = (nm?`${lb(UI.pAthlete)}: <b>${esc(nm)}</b><br>`:"")+`${lb(UI.pCase)} ${code}: ${lb(r.t)}<br>${lb(UI.where)}: ${lb(r.w)}<br>${lb(UI.pDate)}: ${today}`;

  r.n.forEach(n=>notes+=`<p>• ${tx(n)}</p>`);

    (notes?`<div class="pnotes"><h2>${tx(UI.pNotes)}</h2>${notes}</div>`:"")+`<p class="sign">${tx(UI.pSign)}</p>`;
  window.print();
}

  const cur=s.q, res=s.r;
  const q=(id,txt)=>`<div class="node nq ${cur===id?"on":""}">${T(txt)}</div>`;
  const leaf=(L,lbl)=>`<button class="leaf ${res===L?"on":""}" data-l="${L}" aria-label="${T(UI.go)} ${L}"><span class="lbl">${T(lbl)}</span>${L}</button>`;
  const down=t=>`<div class="down">${T(t)}</div>`;
  document.getElementById("map").innerHTML =
    `<div class="branch">${q("est",UI.mEst)}${leaf("A",UI.yes)}</div>${down(UI.no)}`+
    `<div class="branch">${q("nac",UI.mNac)}${leaf("E",UI.yes)}</div>${down(UI.no)}`+
    `<div class="branch">${q("ue",UI.mUe)}<span></span></div>${down(UI.any)}`+
    `<div class="branch">${q("tipo",UI.mTipo)}${leaf("D",UI.mRev)}</div>${down(UI.mFirst)}`+
    `<div class="branch">${q("idade",UI.mIdade)}<span style="display:flex;gap:6px">${leaf("B","≤13")}${leaf("C","14–17")}</span></div>`;
  document.querySelectorAll(".leaf").forEach(b=>b.onclick=()=>{const keep=S.ue;S=Object.assign({},PATHS[b.dataset.l]);if(S.nac==="nao")S.ue=keep||"x";render();document.getElementById("main").scrollIntoView({behavior:"smooth",block:"start"});});
}
function setLang(l){
  LANG=l; document.documentElement.lang = l==="pt"?"pt-PT":"en";
  document.getElementById("lpt").setAttribute("aria-pressed",l==="pt"); document.getElementById("len").setAttribute("aria-pressed",l==="en");
  document.title = l==="pt"?"Guia de Inscrições FPB":"FPB Registration Guide";
  document.getElementById("h1").textContent=T(UI.title); document.getElementById("intro").textContent=T(UI.intro); document.getElementById("eyebrow").textContent=T(UI.eyebrow);
  document.getElementById("rule").innerHTML=T(UI.rule); 
  document.getElementById("foot").innerHTML=T(UI.foot);
  render();
}
document.getElementById("lpt").onclick=()=>setLang("pt");
document.getElementById("len").onclick=()=>setLang("en");

setLang("pt");
</script>
