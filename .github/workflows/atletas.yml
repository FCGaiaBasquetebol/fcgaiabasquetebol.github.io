name: Contar atletas inscritos (FPB)

# Não publica nada no site. Guarda só contagens no ramo "dados-atletas".
on:
  workflow_dispatch:
    inputs:
      clubes:
        description: "todos, ou IDs FPB dos clubes separados por vírgula (FC Gaia = 119)"
        default: "todos"
  push:
    branches: [main]
    paths:
      - scripts/atletas_inscritos.py
      - .github/workflows/atletas.yml

permissions:
  contents: write

concurrency:
  group: atletas
  cancel-in-progress: false

jobs:
  contar:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3 beautifulsoup4==4.12.3
      - name: Cache dos anos de nascimento (não fica no repositório)
        uses: actions/cache@v4
        with:
          path: ano-cache.json
          key: anos-${{ github.run_id }}
          restore-keys: anos-
      - name: Contar atletas
        run: |
          ARGS="--clubes ${{ github.event.inputs.clubes || 'todos' }}"
          python scripts/atletas_inscritos.py $ARGS 2>&1 | tee /tmp/atletas.log
          cp /tmp/atletas.log dados-atletas/
      - name: Mostrar resumo
        run: cat dados-atletas/resumo.md >> "$GITHUB_STEP_SUMMARY"
      - name: Guardar no ramo dados-atletas
        run: |
          cp -r dados-atletas /tmp/out
          cp ano-cache.json /tmp/ 2>/dev/null || true
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          if git fetch origin dados-atletas; then git checkout -f -B dados-atletas FETCH_HEAD; else git checkout --orphan dados-atletas; fi
          git rm -rf . -q || true
          git clean -fdq
          cp /tmp/out/* .
          rm -f ano-cache.json
          git add -A
          git commit -m "Atletas inscritos $(date +%F)" || echo "Sem alterações"
          git push origin dados-atletas
          cp /tmp/ano-cache.json . 2>/dev/null || true
